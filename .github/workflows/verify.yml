name: verify-research-harness

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install service contracts
        run: python -m pip install ".[services]"
      - name: Test and validate benchmark
        env:
          PYTHONPATH: src:.
        run: |
          python -m unittest discover -s tests -v
          python -m longhorizon validate --dataset data/benchmarks/seed_tasks.jsonl
          python -m longhorizon run --config configs/experiment.local.json
          python -m longhorizon analyze --results results/runs.jsonl --output results/summary.json
          python -m longhorizon validate-data --runs results/runs.jsonl --events results/events.jsonl
          python -m longhorizon warehouse --runs results/runs.jsonl --events results/events.jsonl --summary results/summary.json --manifest results/manifest.json --database results/warehouse.sqlite
          python -m longhorizon check --summary results/summary.json --gates configs/quality-gates.local.json --output results/quality.json
          python -m longhorizon dashboard --summary results/summary.json --output results/dashboard.html
          python -m longhorizon report --summary results/summary.json --quality results/quality.json --manifest results/manifest.json --output results/baseline.md
      - name: Validate container topology
        env:
          EXPERIMENT_DB_PASSWORD: ci-placeholder
          TELEMETRY_DB_PASSWORD: ci-placeholder
          MINIO_ROOT_USER: ci-minio-user
          MINIO_ROOT_PASSWORD: ci-minio-password
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: Upload experiment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fixture-baseline
          path: results/
