[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longhorizon-agent-reliability"
version = "0.1.0"
description = "Local-first experiment harness for long-horizon software-agent reliability research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
services = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "nats-py>=2.9,<3",
  "PyYAML>=6.0,<7"
]
benchmark = ["pyarrow>=15,<26"]

[project.scripts]
longhorizon = "longhorizon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
